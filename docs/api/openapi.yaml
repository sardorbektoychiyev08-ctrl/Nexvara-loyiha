openapi: 3.1.0
info:
  title: NEXVARA Windows Agent - Phone API
  version: "1"
  description: |
    The contract between the NEXVARA Android app and the Windows Agent (src/nexvara/remote_v1.py).
    Transport: HTTPS on the local network, self-signed certificate pinned by SHA-256 from the
    pairing QR code. Every JSON reply is an Envelope. Human-readable guide: MOBILE_API.md.
    The unit test tests/unit/test_remote_v1.py::test_openapi_matches_routes keeps the path list
    below identical to the server's ROUTES table.
servers:
  - url: https://{pc_ip}:{port}
    variables:
      pc_ip: {default: 192.168.1.10}
      port: {default: "8765"}
security:
  - deviceToken: []
paths:
  /api/v1/info:
    get:
      summary: Server identity and protocol version (no token)
      security: []
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/InfoEnvelope"}}}}
        "426": {$ref: "#/components/responses/Error"}
  /api/v1/pair:
    post:
      summary: Exchange the one-time 6-digit code for a device token (no token)
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PairRequest"}}}
      responses:
        "200": {description: Paired, content: {application/json: {schema: {$ref: "#/components/schemas/PairEnvelope"}}}}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/v1/session:
    get:
      summary: Who am I; whether the token should be rotated
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SessionEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/session/rotate:
    post:
      summary: Get a new token. The old token keeps working until the new one is first used.
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RotateEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/session/logout:
    post:
      summary: Unpair this phone (the token is deleted on the PC)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LogoutEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/chat:
    post:
      summary: Send a natural-language command to the Core Agent (same pipeline as the PC chat)
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, maxLength: 4000}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ChatEnvelope"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/confirm:
    post:
      summary: Answer a confirmation question (for example an expensive AI request)
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [token, yes], properties: {token: {type: string}, yes: {type: boolean}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ChatEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/tasks:
    get:
      summary: Recent tasks, newest first
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TaskListEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/tasks/watch:
    get:
      summary: Long-poll. Returns as soon as any of the last 20 tasks changes, or after `wait` seconds.
      parameters:
        - {name: etag, in: query, schema: {type: string}, description: etag from the previous tasks/watch reply}
        - {name: wait, in: query, schema: {type: number, minimum: 0, maximum: 25, default: 25}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/WatchEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/tasks/{id}:
    get:
      summary: One task with its steps and result files
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TaskEnvelope"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/tasks/{id}/cancel:
    post:
      summary: Ask a running task to stop (cooperative). cancelled=false when it already finished.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CancelEnvelope"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/files:
    post:
      summary: Upload a file or photo to the PC (raw body, max 50 MB). It becomes the chat's "shu fayl".
      parameters:
        - {name: X-Filename, in: header, required: true, schema: {type: string}, description: URL-encoded file name}
        - {name: X-Content-SHA256, in: header, schema: {type: string}, description: hex SHA-256 of the body; mismatch -> BAD_REQUEST}
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        "200": {description: Saved, content: {application/json: {schema: {$ref: "#/components/schemas/FileEnvelope"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
    get:
      summary: Download a result file. Only files listed in some task's `files` are served.
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: File bytes; header X-Content-SHA256 carries the hex SHA-256
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/sync:
    get:
      summary: All sync records of the PC (settings, memory facts, Teach rules) — see MOBILE_API.md §10
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SyncEnvelope"}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      summary: Send the phone's records; the PC merges them (last writer wins per item) and returns all records
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [records], properties: {records: {type: array, items: {$ref: "#/components/schemas/SyncRecord"}}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SyncEnvelope"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/overview:
    get:
      summary: "Home screen: PC, last tasks, section counts, AI spend panel, sync and Google state"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/chat/history:
    get:
      summary: "PC chat history (same log as the PC window). Query limit (1-200), after (message id)"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/tasks/{id}/pause:
    post:
      summary: "Ask a task to pause at its next step boundary (never inside an Office call). Status becomes paused there; paused time is not a timeout"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/tasks/{id}/resume:
    post:
      summary: "Resume a paused task"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/ai:
    get:
      summary: "AI spend panel: OpenAI, Gemini, Claude, DeepSeek - spent today/month, NEXVARA limits and what is left, real balance if known, official billing URLs, 30-day series. From the PC's single ledger, so phone requests are never counted twice. Keys are never included"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/ai/{provider}/balance:
    post:
      summary: "Refresh the real balance where the provider has an official balance API (DeepSeek). No model is called (free). Others return {supported:false}"
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [openai, gemini, anthropic, deepseek]}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/memory:
    get:
      summary: "Memory facts"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: "Add a fact {text}"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {text: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/memory/search:
    get:
      summary: "Search memory, chat and task titles. Query q"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/memory/{id}:
    post:
      summary: "Edit a fact {text}"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {text: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/memory/{id}/delete:
    post:
      summary: "Delete a fact"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/teach:
    get:
      summary: "Teach NEXVARA rules and app labels"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: "Add a rule {app, text}; with preview=true only checks it and returns the actions"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {app: {}, text: {}, preview: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/teach/{id}:
    post:
      summary: "Change a rule {text?, enabled?}"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {text: {}, enabled: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/teach/{id}/delete:
    post:
      summary: "Delete a rule"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/workflows:
    get:
      summary: "Workflows, templates, active runs, last runs"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: "Create or edit a workflow (same JSON as the PC)"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {workflow: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/workflows/{id}/run:
    post:
      summary: "Run a workflow now; {file} may only be a file the phone uploaded"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {file: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/workflows/{id}/delete:
    post:
      summary: "Delete a workflow"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/workflows/runs/{id}/{action}:
    post:
      summary: "approve | pause | resume a workflow run"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [approve, pause, resume]}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/bi:
    get:
      summary: "Saved NEXVARA BI dashboards"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/bi/open:
    post:
      summary: "Open a saved dashboard {file, state?, show_on_pc=true}: returns compact widgets for the phone and opens it in the PC window"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {file: {}, state: {}, show_on_pc: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/library:
    get:
      summary: "Textbooks on the PC and the grade -> subjects catalog"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/library/test:
    post:
      summary: "Make a test from the textbooks {grade, subject, topic, count, variants, ai}. A paid AI test first returns confirm (answer with /confirm)"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {grade: {}, subject: {}, topic: {}, count: {}, variants: {}, ai: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/office/{kind}:
    post:
      summary: "Run a ready Office task on the PC screen: excel_demo | excel_dashboard | word_report | presentation"
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/account:
    get:
      summary: "Google state: the PC owner account and this phone's link (web_client_id is public)"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/account/link:
    post:
      summary: "Link this phone to the PC owner's Google account {id_token} from Android Credential Manager; accepted only for the Web client ID audience and the owner's sub"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {id_token: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/screen:
    get:
      summary: "The PC screen as JPEG (view only). Off when settings.json remote.screen_view is false; the PC shows that the phone is watching"
      responses:
        "200": {description: JPEG bytes, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/files/search:
    get:
      summary: "Search the PC's user folders by name (q, ext). Results may be opened or shared for 10 minutes; keys, databases and NEXVARA secrets are never listed"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/files/share:
    post:
      summary: "Allow downloading a found file with GET /api/v1/files?path= for 30 minutes"
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      requestBody:
        content: {application/json: {schema: {type: object, properties: {path: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/files/open:
    post:
      summary: "Open a found document on the PC screen (programs and scripts are refused)"
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      requestBody:
        content: {application/json: {schema: {type: object, properties: {path: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/omr:
    get:
      summary: "Answer-sheet sets (title, questions, variants, keys, last results) and whether the last generated test has answer keys"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: "Make a printable answer sheet (PDF opens on the PC): {title, questions 1-60, variants 1-4, keys {variant: ABCD..}, copies} or {from_last_test: true}"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {title: {}, questions: {}, variants: {}, keys: {}, copies: {}, from_last_test: {}, open_on_pc: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/omr/{id}/keys:
    post:
      summary: "Set the correct answers {keys: {variant: ABCD..}}"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {keys: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/omr/{id}/grade:
    post:
      summary: "Grade a photographed sheet {path (uploaded photo), student}: answers, right, percent, mark (2-5), wrong questions; the Excel results file is updated"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {path: {}, student: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/journal:
    get:
      summary: "Class journal: classes with student counts"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: "Add a class {name}"
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {name: {}}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/journal/{id}:
    get:
      summary: "A class: students, last grades, averages, subjects (query subject=)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ok"}}}}
        "400": {$ref: "#/components/responses/Error"}
