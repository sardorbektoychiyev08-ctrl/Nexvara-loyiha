[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvara"
version = "1.0.0"
description = "NEXVARA Personal - Windows AI agent that works inside Microsoft Office"
requires-python = ">=3.11"
dependencies = [
    "pywin32>=306",
    "pywebview>=5",
    "pypdf>=4",
    "telethon>=1.36",
    "cryptography>=41",  # AES-encrypted textbook PDFs
    "pymupdf>=1.24",  # render scanned pages for OCR
    "anthropic>=1.15",  # optional AI provider (used only with the user's own key)
    "openpyxl>=3.1",  # NEXVARA BI reads/writes .xlsx without Excel
    "segno>=1.6",  # QR code for pairing a phone (pure Python)
    "winrt-Windows.Media.Ocr>=2",  # Windows built-in OCR (no API, no install)
    "winrt-Windows.Graphics.Imaging>=2",
    "winrt-Windows.Storage.Streams>=2",
    "winrt-Windows.Globalization>=2",
    "winrt-Windows.Foundation>=2",
    "winrt-Windows.Foundation.Collections>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",  # scripts/build.ps1 (Windows installer)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexvara.app" = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "office: drives real Microsoft Office; runs only when NEXVARA_RUN_OFFICE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/textbook_fixture.py" = ["E501"]
"tests/ui_scripts/*" = ["E501", "E402"]  # long JS selectors; env is set before imports
