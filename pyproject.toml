[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexvara"
version = "0.1.0"
description = "NEXVARA Personal - Windows AI agent that works inside Microsoft Office"
requires-python = ">=3.11"
dependencies = [
    "pywin32>=306",
    "pywebview>=5",
    "pypdf>=4",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexvara.app" = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "office: drives real Microsoft Office; runs only when NEXVARA_RUN_OFFICE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/textbook_fixture.py" = ["E501"]
